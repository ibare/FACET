<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FACET — 스크럽 띠 실험</title>
    <style>
      body {
        margin: 0;
        padding: 32px 24px 64px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #ffffff;
        color: #171717;
      }
      main { max-width: 720px; margin: 0 auto; }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
      p.lead { font-size: 13px; color: #737373; margin: 0 0 28px; line-height: 1.7; }
      section { margin-bottom: 40px; }
      h2 { font-size: 13px; font-weight: 600; color: #737373; margin: 0 0 10px; }
      #probe {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        background: #fafafa;
        border: 1px solid #e5e5e5;
        border-radius: 6px;
        padding: 12px;
        color: #171717;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>스크럽 띠 실험</h1>
      <p class="lead">
        자동 재생이 끝나면 띠를 끌 수 있다. 앞으로 끌면 걸음마다 애니메이션이
        지나가며 화면이 뒤따라오고, 뒤로 끌면 지금 화면에서 목표 화면으로 곧장
        건너간다. 핸들과 화면 사이의 얇아지는 구간이 그 간격이다.
      </p>
      <section>
        <h2>조각 — 해시 눈사태 효과</h2>
        <div id="stage-a"></div>
      </section>
      <section>
        <h2>조각 — 쪼개고 번호 붙이기 (걸음이 길고 rAF 로 그리는 부류)</h2>
        <div id="stage-b"></div>
      </section>
      <section>
        <h2>계측</h2>
        <div id="probe">준비 중…</div>
      </section>
    </main>
    <script type="module" src="/src/scrub-demo.ts"></script>
  </body>
</html>
